<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 720" width="840" height="720">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&amp;family=Outfit:wght@300;400;500;600&amp;display=swap');
    </style>

    <marker id="ah" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#BDBDBD"/>
    </marker>
    <marker id="ah-purple" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#DDD4F0"/>
    </marker>
    <marker id="ah-store" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#9B5DC8"/>
    </marker>
    <marker id="ah-store-rev" markerWidth="7" markerHeight="7" refX="2" refY="2.5" orient="auto-start-reverse">
      <path d="M7,2.5 L0,0 L0,5 z" fill="#9B5DC8"/>
    </marker>

    <radialGradient id="hubGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFBF4"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </radialGradient>

    <filter id="cs" x="-12%" y="-12%" width="124%" height="135%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0000000B"/>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="840" height="720" fill="#ffffff"/>

  <!-- TITLE -->
  <text x="420" y="36" text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="24" font-weight="300" letter-spacing="0.5" fill="#0f0f0f">
    <tspan fill="#0f0f0f">Ersilia </tspan><tspan font-style="italic" fill="#C8922A">Model Hub</tspan><tspan fill="#0f0f0f"> Ecosystem</tspan>
  </text>
  <text x="420" y="52" text-anchor="middle"
        font-family="'Outfit', sans-serif"
        font-size="8.5" font-weight="400" letter-spacing="3.2" fill="#BDBDBD">COMPONENT ARCHITECTURE OVERVIEW</text>

  <!-- ══════════════════════════ CONNECTOR LINES (behind cards) ══════ -->

  <!-- Hub → Storage (up) — hub top is 360-58=302, storage bottom is ~162 -->
  <line x1="420" y1="302" x2="420" y2="163" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ah)"/>

  <!-- Hub → Catalog (curved top-left) -->
  <path d="M 363,332 C 310,310 248,148 222,138" fill="none" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ah)"/>

  <!-- Hub → eos-template (curved top-right) -->
  <path d="M 477,332 C 530,310 593,148 618,138" fill="none" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ah)"/>

  <!-- Hub → Online Inference (left) -->
  <line x1="362" y1="360" x2="222" y2="360" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ah)"/>

  <!-- Hub → Maintenance (right) -->
  <line x1="478" y1="360" x2="618" y2="360" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ah)"/>

  <!-- Hub → ersilia-pack (curved bottom-left) -->
  <path d="M 363,388 C 310,410 248,476 222,480" fill="none" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ah)"/>

  <!-- Hub → Isaura (down) — hub bottom is 360+58=418, isaura top is ~530 -->
  <line x1="420" y1="418" x2="420" y2="530" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ah)"/>

  <!-- Hub → EOSVC (curved bottom-right) -->
  <path d="M 477,388 C 530,410 593,490 618,494" fill="none" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ah)"/>

  <!-- Splunk → Isaura (horizontal) -->
  <line x1="222" y1="600" x2="298" y2="580" stroke="#DDD4F0" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ah-purple)"/>

  <!-- ══════════════════════════ CENTER HUB ══════════════════════════ -->
  <circle cx="420" cy="360" r="66" fill="none" stroke="#E8E5E0" stroke-width="1"/>
  <circle cx="420" cy="360" r="57" fill="url(#hubGrad)" stroke="#0f0f0f" stroke-width="1"/>
  <text x="420" y="351" text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="18" font-weight="600" letter-spacing="0.3" fill="#0f0f0f">Ersilia</text>
  <text x="420" y="366" text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="12" font-weight="300" letter-spacing="1.1" fill="#7A7672">Model Hub</text>
  <circle cx="420" cy="379" r="2.2" fill="#C8922A"/>

  <!-- ══════════════════════════ MODEL STORAGE (top-centre) ══════════ -->
  <!-- x=295 y=88 w=250 h=75 -->
  <g filter="url(#cs)">
    <rect x="295" y="88" width="250" height="75" rx="4" fill="#ffffff" stroke="#E8E5E0" stroke-width="1"/>
    <rect x="295" y="88" width="250" height="20" rx="4" fill="#FAFAFA"/>
    <rect x="295" y="98" width="250" height="10" fill="#FAFAFA"/>
    <line x1="295" y1="108" x2="545" y2="108" stroke="#E8E5E0" stroke-width="1"/>
    <circle cx="308" cy="98" r="2.2" fill="#9B5DC8"/>
    <text x="315" y="101.5" font-family="'Outfit', sans-serif" font-size="7" font-weight="500" letter-spacing="1.8" fill="#7A7672">MODEL STORAGE</text>
    <!-- GitHub -->
    <rect x="304" y="114" width="66" height="40" rx="3" fill="#ffffff" stroke="#E8E5E0" stroke-width="1"/>
    <text x="337" y="129" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="500" fill="#0f0f0f">GitHub</text>
    <text x="337" y="141" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7" fill="#9E9E9E">Code &amp; repos</text>
    <!-- DockerHub -->
    <rect x="377" y="114" width="66" height="40" rx="3" fill="#ffffff" stroke="#E8E5E0" stroke-width="1"/>
    <text x="410" y="129" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="500" fill="#0f0f0f">DockerHub</text>
    <text x="410" y="141" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7" fill="#9E9E9E">Containers</text>
    <!-- S3 -->
    <rect x="450" y="114" width="66" height="40" rx="3" fill="#ffffff" stroke="#E8E5E0" stroke-width="1"/>
    <text x="483" y="129" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="500" fill="#0f0f0f">Amazon S3</text>
    <text x="483" y="141" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7" fill="#9E9E9E">Large files</text>
  </g>

  <!-- ══════════════════════════ CATALOG (top-left) ══════════════════ -->
  <!-- x=46 y=100 w=162 h=76 — right edge at 208, centre x=127 -->
  <g filter="url(#cs)">
    <rect x="46" y="100" width="162" height="76" rx="4" fill="#ffffff" stroke="#E8E5E0" stroke-width="1"/>
    <rect x="46" y="100" width="162" height="20" rx="4" fill="#FEF5E7"/>
    <rect x="46" y="110" width="162" height="10" fill="#FEF5E7"/>
    <line x1="46" y1="120" x2="208" y2="120" stroke="#E8E5E0" stroke-width="1"/>
    <circle cx="58" cy="110" r="2.2" fill="#C8922A"/>
    <text x="65" y="113.5" font-family="'Outfit', sans-serif" font-size="7" font-weight="500" letter-spacing="1.8" fill="#7C4A03">WEB APP</text>
    <text x="127" y="140" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="15" font-weight="600" fill="#0f0f0f">Catalog</text>
    <text x="127" y="154" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" fill="#7A7672">Search &amp; browse models</text>
    <text x="127" y="166" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" fill="#7A7672">across storage backends</text>
  </g>

  <!-- ══════════════════════════ EOS-TEMPLATE (top-right) ═══════════ -->
  <!-- x=632 y=100 w=162 h=76 — left edge 632, centre x=713 -->
  <g filter="url(#cs)">
    <rect x="632" y="100" width="162" height="76" rx="4" fill="#ffffff" stroke="#E8E5E0" stroke-width="1"/>
    <rect x="632" y="100" width="162" height="20" rx="4" fill="#EEF4FB"/>
    <rect x="632" y="110" width="162" height="10" fill="#EEF4FB"/>
    <line x1="632" y1="120" x2="794" y2="120" stroke="#E8E5E0" stroke-width="1"/>
    <circle cx="644" cy="110" r="2.2" fill="#3B7DD8"/>
    <text x="651" y="113.5" font-family="'Outfit', sans-serif" font-size="7" font-weight="500" letter-spacing="1.8" fill="#1A3A5C">SCAFFOLDING REPO</text>
    <text x="713" y="140" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="15" font-weight="600" fill="#0f0f0f">eos-template</text>
    <text x="713" y="154" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" fill="#7A7672">Bootstraps new model repos</text>
    <text x="713" y="166" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" fill="#7A7672">via GitHub issue workflow</text>
  </g>

  <!-- ══════════════════════════ ONLINE INFERENCE (left) ════════════ -->
  <!-- x=46 y=322 w=162 h=76 — right edge 208, centre y=360 -->
  <g filter="url(#cs)">
    <rect x="46" y="322" width="162" height="76" rx="4" fill="#ffffff" stroke="#E8E5E0" stroke-width="1"/>
    <rect x="46" y="322" width="162" height="20" rx="4" fill="#FEF5E7"/>
    <rect x="46" y="332" width="162" height="10" fill="#FEF5E7"/>
    <line x1="46" y1="342" x2="208" y2="342" stroke="#E8E5E0" stroke-width="1"/>
    <circle cx="58" cy="332" r="2.2" fill="#C8922A"/>
    <text x="65" y="335.5" font-family="'Outfit', sans-serif" font-size="7" font-weight="500" letter-spacing="1.8" fill="#7C4A03">WEB APP</text>
    <text x="127" y="360" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="15" font-weight="600" fill="#0f0f0f">Online Inference</text>
    <text x="127" y="374" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" fill="#7A7672">Run models in browser</text>
    <text x="127" y="386" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" fill="#7A7672">&amp; download predictions</text>
  </g>

  <!-- ══════════════════════════ MAINTENANCE (right) ════════════════ -->
  <!-- x=632 y=322 w=162 h=76 — left edge 632, centre y=360 -->
  <g filter="url(#cs)">
    <rect x="632" y="322" width="162" height="76" rx="4" fill="#ffffff" stroke="#E8E5E0" stroke-width="1"/>
    <rect x="632" y="322" width="162" height="20" rx="4" fill="#EEF4FB"/>
    <rect x="632" y="332" width="162" height="10" fill="#EEF4FB"/>
    <line x1="632" y1="342" x2="794" y2="342" stroke="#E8E5E0" stroke-width="1"/>
    <circle cx="644" cy="332" r="2.2" fill="#3B7DD8"/>
    <text x="651" y="335.5" font-family="'Outfit', sans-serif" font-size="7" font-weight="500" letter-spacing="1.8" fill="#1A3A5C">CI / TESTING</text>
    <text x="713" y="360" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="15" font-weight="600" fill="#0f0f0f">Maintenance</text>
    <text x="713" y="374" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" fill="#7A7672">Automated routine tests</text>
    <text x="713" y="386" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" fill="#7A7672">across all registered models</text>
  </g>

  <!-- ══════════════════════════ ERSILIA-PACK (bottom-left) ═════════ -->
  <!-- x=46 y=442 w=162 h=76 — right edge 208, centre y=480 -->
  <g filter="url(#cs)">
    <rect x="46" y="442" width="162" height="76" rx="4" fill="#ffffff" stroke="#E8E5E0" stroke-width="1"/>
    <rect x="46" y="442" width="162" height="20" rx="4" fill="#EEF4FB"/>
    <rect x="46" y="452" width="162" height="10" fill="#EEF4FB"/>
    <line x1="46" y1="462" x2="208" y2="462" stroke="#E8E5E0" stroke-width="1"/>
    <circle cx="58" cy="452" r="2.2" fill="#3B7DD8"/>
    <text x="65" y="455.5" font-family="'Outfit', sans-serif" font-size="7" font-weight="500" letter-spacing="1.8" fill="#1A3A5C">PACKAGING TOOL</text>
    <text x="127" y="480" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="15" font-weight="600" fill="#0f0f0f">ersilia-pack</text>
    <text x="127" y="494" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" fill="#7A7672">Packages models into</text>
    <text x="127" y="506" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" fill="#7A7672">self-contained REST APIs</text>
  </g>

  <!-- ══════════════════════════ EOSVC (bottom-right) ══════════════ -->
  <!-- x=632 y=456 w=162 h=82 — left edge 632, centre y=497 -->
  <g filter="url(#cs)">
    <rect x="632" y="456" width="162" height="84" rx="4" fill="#ffffff" stroke="#E8E5E0" stroke-width="1"/>
    <rect x="632" y="456" width="162" height="20" rx="4" fill="#EEF7EC"/>
    <rect x="632" y="466" width="162" height="10" fill="#EEF7EC"/>
    <line x1="632" y1="476" x2="794" y2="476" stroke="#E8E5E0" stroke-width="1"/>
    <circle cx="644" cy="466" r="2.2" fill="#4CA64C"/>
    <text x="651" y="469.5" font-family="'Outfit', sans-serif" font-size="7" font-weight="500" letter-spacing="1.8" fill="#2D4A22">FILE MANAGER</text>
    <text x="713" y="494" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="15" font-weight="600" fill="#0f0f0f">EOSVC</text>
    <text x="713" y="508" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" fill="#7A7672">Version control for large files</text>
    <text x="713" y="520" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" fill="#7A7672">synced to S3, code on GitHub</text>
  </g>

  <!-- ══════════════════════════ ISAURA (bottom-centre) ════════════ -->
  <!-- x=298 y=530 w=244 h=108 — centre x=420 -->
  <g filter="url(#cs)">
    <rect x="298" y="530" width="244" height="108" rx="4" fill="#ffffff" stroke="#DDD4F0" stroke-width="1"/>
    <rect x="298" y="530" width="244" height="20" rx="4" fill="#F7F3FD"/>
    <rect x="298" y="540" width="244" height="10" fill="#F7F3FD"/>
    <line x1="298" y1="550" x2="542" y2="550" stroke="#DDD4F0" stroke-width="1"/>
    <circle cx="310" cy="540" r="2.2" fill="#9B5DC8"/>
    <text x="317" y="543.5" font-family="'Outfit', sans-serif" font-size="7" font-weight="500" letter-spacing="1.8" fill="#6B4A9B">PRECALCULATION STORE</text>
    <text x="420" y="568" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" font-weight="600" fill="#0f0f0f">Isaura</text>
    <text x="420" y="581" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" fill="#7A7672">Cache &amp; share model outputs across the community</text>
    <!-- User Store -->
    <rect x="307" y="589" width="102" height="40" rx="3" fill="#F7F3FD" stroke="#DDD4F0" stroke-width="1"/>
    <text x="358" y="604" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="500" fill="#6B4A9B">User Store</text>
    <text x="358" y="617" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7.5" fill="#9E9E9E">Local · your machine</text>
    <!-- bidirectional arrow -->
    <line x1="411" y1="609" x2="431" y2="609" stroke="#9B5DC8" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#ah-store)" marker-start="url(#ah-store-rev)"/>
    <!-- Cloud Store -->
    <rect x="433" y="589" width="102" height="40" rx="3" fill="#F7F3FD" stroke="#DDD4F0" stroke-width="1"/>
    <text x="484" y="604" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="500" fill="#6B4A9B">Cloud Store</text>
    <text x="484" y="617" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7.5" fill="#9E9E9E">Shared · community</text>
  </g>

  <!-- ══════════════════════════ SPLUNK (bottom-left) ══════════════ -->
  <!-- x=46 y=562 w=162 h=76 — right edge 208, centre y=600 -->
  <g filter="url(#cs)">
    <rect x="46" y="562" width="162" height="76" rx="4" fill="#ffffff" stroke="#E8E5E0" stroke-width="1"/>
    <rect x="46" y="562" width="162" height="20" rx="4" fill="#FEF5E7"/>
    <rect x="46" y="572" width="162" height="10" fill="#FEF5E7"/>
    <line x1="46" y1="582" x2="208" y2="582" stroke="#E8E5E0" stroke-width="1"/>
    <circle cx="58" cy="572" r="2.2" fill="#C8922A"/>
    <text x="65" y="575.5" font-family="'Outfit', sans-serif" font-size="7" font-weight="500" letter-spacing="1.8" fill="#7C4A03">WEB APP</text>
    <text x="127" y="600" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="15" font-weight="600" fill="#0f0f0f">Splunk Dashboard</text>
    <text x="127" y="614" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" fill="#7A7672">Monitors health &amp; usage</text>
    <text x="127" y="626" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" fill="#7A7672">of Isaura's cloud store</text>
  </g>

  <!-- ══════════════════════════ LEGEND ════════════════════════════ -->
  <rect x="46" y="660" width="748" height="32" rx="4" fill="#FAFAFA" stroke="#E8E5E0" stroke-width="1"/>
  <circle cx="100" cy="676" r="3" fill="#C8922A"/>
  <text x="108" y="679.5" font-family="'Outfit', sans-serif" font-size="8.5" fill="#7A7672">Web Application</text>
  <circle cx="217" cy="676" r="3" fill="#3B7DD8"/>
  <text x="225" y="679.5" font-family="'Outfit', sans-serif" font-size="8.5" fill="#7A7672">Repository / Tool</text>
  <circle cx="334" cy="676" r="3" fill="#4CA64C"/>
  <text x="342" y="679.5" font-family="'Outfit', sans-serif" font-size="8.5" fill="#7A7672">Infrastructure</text>
  <circle cx="430" cy="676" r="3" fill="#9B5DC8"/>
  <text x="438" y="679.5" font-family="'Outfit', sans-serif" font-size="8.5" fill="#7A7672">Storage / Store</text>
  <line x1="524" y1="676" x2="544" y2="676" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="550" y="679.5" font-family="'Outfit', sans-serif" font-size="8.5" fill="#7A7672">Data / Control Flow</text>
</svg>
