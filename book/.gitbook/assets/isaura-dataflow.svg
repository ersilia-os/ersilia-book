<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" width="840" height="540">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&amp;family=Outfit:wght@300;400;500;600&amp;display=swap');
    </style>

    <marker id="ah-purple" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#9B5DC8"/>
    </marker>
    <marker id="ah-blue" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#3B7DD8"/>
    </marker>
    <marker id="ah-green" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#4CA64C"/>
    </marker>
    <marker id="ah-amber" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#C8922A"/>
    </marker>

    <linearGradient id="localGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF7FF"/>
      <stop offset="100%" stop-color="#F2EDFC"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0F6FF"/>
      <stop offset="100%" stop-color="#E8F0FD"/>
    </linearGradient>

    <filter id="cs" x="-12%" y="-12%" width="124%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#00000010"/>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="840" height="540" fill="#ffffff"/>

  <!-- TITLE -->
  <text x="420" y="36" text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="24" font-weight="300" fill="#0f0f0f">
    <tspan>Isaura — </tspan><tspan font-style="italic" fill="#9B5DC8">Data Flow Architecture</tspan>
  </text>
  <text x="420" y="52" text-anchor="middle"
        font-family="'Outfit', sans-serif"
        font-size="8.5" font-weight="400" letter-spacing="3.2" fill="#BDBDBD">PRECALCULATION STORE · READ / WRITE / PUSH / PULL</text>


  <!-- ══════════════════════════════════════════════════════════════ -->
  <!--  PANEL 1 — USER COMPUTER   x=38 y=76 w=188 h=310            -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <g filter="url(#cs)">
    <rect x="38" y="76" width="188" height="320" rx="6" fill="#ffffff" stroke="#E8E5E0" stroke-width="1"/>
    <!-- header -->
    <rect x="38" y="76"  width="188" height="24" rx="6" fill="#FEF5E7"/>
    <rect x="38" y="88"  width="188" height="12" fill="#FEF5E7"/>
    <line x1="38" y1="100" x2="226" y2="100" stroke="#F0DFC0" stroke-width="1"/>
    <circle cx="51" cy="88" r="2.2" fill="#C8922A"/>
    <text x="59" y="91.5" font-family="'Outfit', sans-serif" font-size="7" font-weight="500" letter-spacing="1.8" fill="#7C4A03">USER MACHINE</text>

    <!-- laptop icon -->
    <rect x="107" y="112" width="48" height="31" rx="3" fill="none" stroke="#D0CCC7" stroke-width="1.2"/>
    <rect x="99"  y="143" width="64" height="5"  rx="2" fill="none" stroke="#D0CCC7" stroke-width="1.2"/>
    <rect x="112" y="139" width="38" height="4"  rx="1" fill="#E8E5E0"/>

    <text x="132" y="162" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" font-weight="600" fill="#0f0f0f">User Computer</text>
    <text x="132" y="175" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8" fill="#9E9E9E">Ersilia CLI / Python SDK</text>

    <line x1="58" y1="187" x2="206" y2="187" stroke="#F0EEEB" stroke-width="1"/>
    <text x="132" y="201" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7" font-weight="500" letter-spacing="1.5" fill="#BDBDBD">PRECALCULATIONS</text>

    <!-- CSV file icon centred in panel -->
    <!-- file body -->
    <rect x="101" y="209" width="42" height="52" rx="3" fill="#F5EEF9" stroke="#DDD4F0" stroke-width="1.2"/>
    <!-- folded corner -->
    <polyline points="131,209 143,221 131,221" fill="#DDD4F0" stroke="#DDD4F0" stroke-width="0.5"/>
    <polyline points="131,209 131,221 143,221" fill="#EDE5FA" stroke="none"/>
    <!-- CSV label -->
    <text x="122" y="244" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8" font-weight="600" fill="#9B5DC8">CSV</text>
    <!-- data lines -->
    <line x1="109" y1="252" x2="135" y2="252" stroke="#DDD4F0" stroke-width="1"/>
    <line x1="109" y1="257" x2="135" y2="257" stroke="#DDD4F0" stroke-width="1"/>
    <line x1="109" y1="262" x2="128" y2="262" stroke="#DDD4F0" stroke-width="1"/>

    <text x="132" y="278" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8" fill="#9E9E9E">Precalculation results</text>
    <text x="132" y="289" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8" fill="#9E9E9E">to read or write</text>

    <line x1="58" y1="299" x2="206" y2="299" stroke="#F0EEEB" stroke-width="1"/>
    <text x="132" y="313" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7" font-weight="500" letter-spacing="1.5" fill="#BDBDBD">ACTIONS</text>

    <!-- isaura.read() / write() -->
    <rect x="58" y="320" width="148" height="30" rx="3" fill="#F5EEF9" stroke="#DDD4F0" stroke-width="1"/>
    <circle cx="71" cy="335" r="2.8" fill="#9B5DC8"/>
    <text x="81" y="332" font-family="'Outfit', sans-serif" font-size="9" font-weight="500" fill="#4A1D5A">isaura.read() / write()</text>
    <text x="81" y="344" font-family="'Outfit', sans-serif" font-size="7.5" fill="#9E9E9E">Read or write to local cache</text>

    <!-- isaura.push() / pull() -->
    <rect x="58" y="358" width="148" height="30" rx="3" fill="#EEF7EC" stroke="#C2E0BF" stroke-width="1"/>
    <circle cx="71" cy="373" r="2.8" fill="#4CA64C"/>
    <text x="81" y="370" font-family="'Outfit', sans-serif" font-size="9" font-weight="500" fill="#2D4A22">isaura.push() / pull()</text>
    <text x="81" y="382" font-family="'Outfit', sans-serif" font-size="7.5" fill="#9E9E9E">Sync with cloud store</text>
  </g>


  <!-- ══════════════════════════════════════════════════════════════ -->
  <!--  PANEL 2 — LOCAL ISAURA   x=262 y=76 w=220 h=390            -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <g filter="url(#cs)">
    <rect x="262" y="76" width="220" height="390" rx="6" fill="url(#localGrad)" stroke="#DDD4F0" stroke-width="1.2"/>
    <!-- header -->
    <rect x="262" y="76"  width="220" height="24" rx="6" fill="#EDE5FA"/>
    <rect x="262" y="88"  width="220" height="12" fill="#EDE5FA"/>
    <line x1="262" y1="100" x2="482" y2="100" stroke="#DDD4F0" stroke-width="1"/>
    <circle cx="275" cy="88" r="2.2" fill="#9B5DC8"/>
    <text x="283" y="91.5" font-family="'Outfit', sans-serif" font-size="7" font-weight="500" letter-spacing="1.8" fill="#6B4A9B">LOCAL STORE</text>

    <!-- title -->
    <text x="372" y="126" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" font-weight="600" fill="#0f0f0f">Isaura</text>
    <text x="372" y="141" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="11" font-weight="300" letter-spacing="1.5" fill="#9B5DC8" font-style="italic">User Store</text>
    <circle cx="372" cy="153" r="2.2" fill="#C8922A"/>

    <line x1="282" y1="164" x2="462" y2="164" stroke="#E5DCFA" stroke-width="1"/>
    <text x="372" y="180" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7" font-weight="500" letter-spacing="1.5" fill="#BDBDBD">DESCRIPTION</text>

    <text x="372" y="198" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="9" fill="#7A7672">Caches model outputs on your</text>
    <text x="372" y="211" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="9" fill="#7A7672">local machine. Results are reused</text>
    <text x="372" y="224" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="9" fill="#7A7672">automatically on subsequent runs.</text>

    <line x1="282" y1="240" x2="462" y2="240" stroke="#E5DCFA" stroke-width="1"/>
    <text x="372" y="257" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7" font-weight="500" letter-spacing="1.5" fill="#BDBDBD">CACHE BEHAVIOUR</text>

    <!-- Cache Hit -->
    <rect x="282" y="265" width="92" height="70" rx="3" fill="#ffffff" stroke="#DDD4F0" stroke-width="1"/>
    <text x="328" y="281" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="500" fill="#0f0f0f">Cache Hit</text>
    <line x1="292" y1="288" x2="364" y2="288" stroke="#E5DCFA" stroke-width="0.8"/>
    <text x="328" y="302" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7.5" fill="#7A7672">Result returned</text>
    <text x="328" y="315" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7.5" fill="#7A7672">instantly · no</text>
    <text x="328" y="328" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7.5" fill="#7A7672">model run needed</text>

    <!-- Cache Miss -->
    <rect x="388" y="265" width="74" height="70" rx="3" fill="#ffffff" stroke="#DDD4F0" stroke-width="1"/>
    <text x="425" y="281" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="500" fill="#0f0f0f">Cache Miss</text>
    <line x1="398" y1="288" x2="452" y2="288" stroke="#E5DCFA" stroke-width="0.8"/>
    <text x="425" y="302" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7.5" fill="#7A7672">Model runs ·</text>
    <text x="425" y="315" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7.5" fill="#7A7672">result stored</text>
    <text x="425" y="328" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7.5" fill="#7A7672">for next time</text>

    <line x1="282" y1="350" x2="462" y2="350" stroke="#E5DCFA" stroke-width="1"/>
    <text x="372" y="367" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7" font-weight="500" letter-spacing="1.5" fill="#BDBDBD">SYNC</text>
    <text x="372" y="385" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="9" fill="#7A7672">Push results to cloud to share</text>
    <text x="372" y="398" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="9" fill="#7A7672">with the community. Pull to</text>
    <text x="372" y="411" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="9" fill="#7A7672">download others' calculations.</text>
    <text x="372" y="424" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="9" fill="#7A7672"> </text>
  </g>


  <!-- ══════════════════════════════════════════════════════════════ -->
  <!--  PANEL 3 — CLOUD ISAURA   x=528 y=76 w=274 h=390            -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <g filter="url(#cs)">
    <rect x="528" y="76" width="274" height="320" rx="6" fill="url(#cloudGrad)" stroke="#BFDBFE" stroke-width="1.2"/>
    <!-- header -->
    <rect x="528" y="76"  width="274" height="24" rx="6" fill="#DBEAFE"/>
    <rect x="528" y="88"  width="274" height="12" fill="#DBEAFE"/>
    <line x1="528" y1="100" x2="802" y2="100" stroke="#BFDBFE" stroke-width="1"/>
    <circle cx="541" cy="88" r="2.2" fill="#3B7DD8"/>
    <text x="549" y="91.5" font-family="'Outfit', sans-serif" font-size="7" font-weight="500" letter-spacing="1.8" fill="#1A3A5C">CLOUD STORE</text>

    <!-- title -->
    <text x="665" y="126" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" font-weight="600" fill="#0f0f0f">Isaura</text>
    <text x="665" y="141" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="11" font-weight="300" letter-spacing="1.5" fill="#3B7DD8" font-style="italic">Cloud Store</text>
    <circle cx="665" cy="153" r="2.2" fill="#C8922A"/>

    <line x1="548" y1="164" x2="782" y2="164" stroke="#DBEAFE" stroke-width="1"/>
    <text x="665" y="180" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7" font-weight="500" letter-spacing="1.5" fill="#BDBDBD">DESCRIPTION</text>

    <text x="665" y="198" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="9" fill="#7A7672">Shared community server. Users push</text>
    <text x="665" y="211" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="9" fill="#7A7672">their local results to share with others</text>
    <text x="665" y="224" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="9" fill="#7A7672">and pull results from the pool.</text>

    <line x1="548" y1="240" x2="782" y2="240" stroke="#DBEAFE" stroke-width="1"/>
    <text x="665" y="257" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7" font-weight="500" letter-spacing="1.5" fill="#BDBDBD">ACCESS TIERS</text>

    <!-- Public store card — title only -->
    <rect x="548" y="265" width="110" height="44" rx="4" fill="#ffffff" stroke="#C2E0BF" stroke-width="1"/>
    <rect x="548" y="265" width="110" height="24" rx="4" fill="#EEF7EC"/>
    <rect x="548" y="277" width="110" height="12" fill="#EEF7EC"/>
    <line x1="548" y1="289" x2="658" y2="289" stroke="#C2E0BF" stroke-width="1"/>
    <circle cx="560" cy="277" r="2" fill="#4CA64C"/>
    <text x="568" y="280.5" font-family="'Outfit', sans-serif" font-size="7" font-weight="500" letter-spacing="1.2" fill="#2D4A22">PUBLIC</text>
    <text x="603" y="304" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" font-weight="600" fill="#0f0f0f">Public Store</text>

    <!-- Private store card — title only -->
    <rect x="672" y="265" width="110" height="44" rx="4" fill="#ffffff" stroke="#F0DFC0" stroke-width="1"/>
    <rect x="672" y="265" width="110" height="24" rx="4" fill="#FEF5E7"/>
    <rect x="672" y="277" width="110" height="12" fill="#FEF5E7"/>
    <line x1="672" y1="289" x2="782" y2="289" stroke="#F0DFC0" stroke-width="1"/>
    <circle cx="684" cy="277" r="2" fill="#C8922A"/>
    <text x="692" y="280.5" font-family="'Outfit', sans-serif" font-size="7" font-weight="500" letter-spacing="1.2" fill="#7C4A03">PRIVATE</text>
    <text x="727" y="304" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" font-weight="600" fill="#0f0f0f">Private Store</text>

    <line x1="548" y1="324" x2="782" y2="324" stroke="#DBEAFE" stroke-width="1"/>

    <!-- lock icon -->
    <rect x="640" y="337" width="16" height="12" rx="2" fill="none" stroke="#BDBDBD" stroke-width="1.2"/>
    <path d="M644,337 Q644,332 648,332 Q652,332 652,337" fill="none" stroke="#BDBDBD" stroke-width="1.2"/>
    <circle cx="648" cy="343" r="1.8" fill="#BDBDBD"/>
    <text x="662" y="347" font-family="'Outfit', sans-serif" font-size="8.5" fill="#7A7672">Private requires an access key.</text>

    <line x1="548" y1="360" x2="782" y2="360" stroke="#DBEAFE" stroke-width="1"/>
    <text x="665" y="377" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7.5" fill="#9E9E9E">S3-compatible · Splunk monitoring</text>
  </g>


  <!-- ══════════════════════════════════════════════════════════════ -->
  <!--  ARROWS  User ↔ Local  (gap x=226→262, centre=244)          -->
  <!-- ══════════════════════════════════════════════════════════════ -->

  <!-- write: User → Local -->
  <line x1="228" y1="335" x2="260" y2="335" stroke="#9B5DC8" stroke-width="1.5" marker-end="url(#ah-purple)"/>
  <rect x="229" y="321" width="30" height="12" rx="2" fill="#ffffff"/>
  <text x="244" y="330.5" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7.5" font-weight="500" fill="#9B5DC8">write</text>

  <!-- read: Local → User -->
  <line x1="260" y1="354" x2="228" y2="354" stroke="#3B7DD8" stroke-width="1.5" marker-end="url(#ah-blue)"/>
  <rect x="229" y="356" width="30" height="12" rx="2" fill="#ffffff"/>
  <text x="244" y="365.5" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7.5" font-weight="500" fill="#3B7DD8">read</text>


  <!-- ══════════════════════════════════════════════════════════════ -->
  <!--  ARROWS  Local ↔ Cloud  (gap x=482→528, centre=505)         -->
  <!-- ══════════════════════════════════════════════════════════════ -->

  <!-- push: Local → Cloud -->
  <line x1="484" y1="283" x2="526" y2="283" stroke="#4CA64C" stroke-width="1.5" marker-end="url(#ah-green)"/>
  <rect x="488" y="269" width="30" height="12" rx="2" fill="#ffffff"/>
  <text x="503" y="278.5" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7.5" font-weight="500" fill="#4CA64C">push</text>

  <!-- pull: Cloud → Local -->
  <line x1="526" y1="302" x2="484" y2="302" stroke="#C8922A" stroke-width="1.5" marker-end="url(#ah-amber)"/>
  <rect x="488" y="304" width="28" height="12" rx="2" fill="#ffffff"/>
  <text x="502" y="313.5" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7.5" font-weight="500" fill="#C8922A">pull</text>


  <!-- ══════════════════════════════════════════════════════════════ -->
  <!--  LEGEND                                                      -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <rect x="38" y="486" width="764" height="32" rx="4" fill="#FAFAFA" stroke="#E8E5E0" stroke-width="1"/>

  <line x1="72"  y1="502" x2="90"  y2="502" stroke="#9B5DC8" stroke-width="1.5" marker-end="url(#ah-purple)"/>
  <text x="96"  y="505.5" font-family="'Outfit', sans-serif" font-size="8.5" fill="#7A7672">Write · store result locally</text>

  <line x1="248" y1="502" x2="266" y2="502" stroke="#3B7DD8" stroke-width="1.5" marker-end="url(#ah-blue)"/>
  <text x="272" y="505.5" font-family="'Outfit', sans-serif" font-size="8.5" fill="#7A7672">Read · retrieve cached result</text>

  <line x1="440" y1="502" x2="458" y2="502" stroke="#4CA64C" stroke-width="1.5" marker-end="url(#ah-green)"/>
  <text x="464" y="505.5" font-family="'Outfit', sans-serif" font-size="8.5" fill="#7A7672">Push · upload to cloud</text>

  <line x1="604" y1="502" x2="622" y2="502" stroke="#C8922A" stroke-width="1.5" marker-end="url(#ah-amber)"/>
  <text x="628" y="505.5" font-family="'Outfit', sans-serif" font-size="8.5" fill="#7A7672">Pull · download from cloud</text>

</svg>
